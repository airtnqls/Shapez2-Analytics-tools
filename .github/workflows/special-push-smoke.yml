name: Smoke legacy S-S-c Pin receipt

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/half-linear-fastpath
    paths:
      - '.github/workflows/special-push-smoke.yml'
      - 'corner_tracer.py'
      - 'shape.py'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay hardcoded predecessor
        run: |
          python - <<'PY' > /tmp/special-push.json
          import contextlib, io, json, sys, types
          pyqt6=types.ModuleType('PyQt6'); qt=types.ModuleType('PyQt6.QtCore')
          class QThread: pass
          qt.QThread=QThread; qt.pyqtSignal=lambda *a,**k: None; pyqt6.QtCore=qt
          sys.modules['PyQt6']=pyqt6; sys.modules['PyQt6.QtCore']=qt
          from shape import Shape
          Shape.MAX_LAYERS=5
          def structural(shape):
              rows=[]
              for layer in shape.layers:
                  row=''
                  for q in layer.quadrants:
                      row += '-' if q is None else 'P' if q.shape=='P' else 'c' if q.shape=='c' else 'S'
                  rows.append(row)
              while rows and rows[-1]=='----': rows.pop()
              return ':'.join(rows)
          pred=Shape.from_string('-PcS:SPcc:SPcS:cSc-:--c-'); pred.max_layers=5
          pushed=pred.push_pin()
          target=Shape.from_string('S---:----:S---:----:c---'); target.max_layers=5
          result={'predecessor':structural(pred),'push_result':structural(pushed),'target':structural(target),'exact':structural(pushed)==structural(target)}
          print(json.dumps(result,indent=2))
          PY
          cat /tmp/special-push.json
      - name: Persist result
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const content=fs.readFileSync('/tmp/special-push.json','utf8');
            const path='experiments/results/special-push-smoke.json'; let sha;
            try { const r=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'experiment/half-linear-fastpath'}); sha=r.data.sha; }
            catch(e){ if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'experiment/half-linear-fastpath',message:'Record special Pin smoke [skip ci]',content:Buffer.from(content).toString('base64'),...(sha?{sha}:{})});
