name: Exact Pin Push predecessor search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  general-search:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce unconstrained search
        working-directory: experiments/legacy_recipe
        run: PYTHONPATH=../.. python evolve_pin_predecessor.py > pin-predecessor-search.json
      - uses: actions/upload-artifact@v4
        with:
          name: pin-predecessor-general-search
          path: experiments/legacy_recipe/pin-predecessor-search.json

  bottom-fall-search:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce bottom-fall constrained search
        working-directory: experiments/legacy_recipe
        run: |
          PYTHONPATH=../.. python - <<'PY' > bottom-fall-search.json
          import json
          from search_bottom_fall_predecessor import search
          print(json.dumps(search(max_seconds=125.0, max_evaluations=95000), ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bottom-fall-predecessor-search
          path: experiments/legacy_recipe/bottom-fall-search.json
