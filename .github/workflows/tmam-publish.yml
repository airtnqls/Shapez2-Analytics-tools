name: TMAM verified deployment assets
on:
  push:
    branches: [deploy/tmam-client-v105]
    paths: [.github/workflows/tmam-publish.yml]
permissions:
  contents: write
jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preserve and verify the published catalog snapshot
        shell: python
        run: |
          import concurrent.futures, gzip, hashlib, json, pathlib, re, urllib.request, zipfile
          base = 'https://tmam-web.netlify.app/'
          out = pathlib.Path('baseline'); out.mkdir()
          def get(path):
              if path.startswith('/') or '..' in path.split('/') or ':' in path:
                  raise ValueError('Unsafe asset path')
              req = urllib.request.Request(base + path, headers={'Accept-Encoding':'identity'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  data = r.read()
              return data
          manifest_bytes = get('data/manifest-v100.json')
          assert hashlib.sha256(manifest_bytes).hexdigest() == '94e9562fa2a01d3ad48f848c067fc081e0d0c7b73b9441c3ed2529d6232207ff'
          manifest = json.loads(manifest_bytes)
          (out/'data').mkdir(); (out/'data/manifest-v100.json').write_bytes(manifest_bytes)
          chunks = {}
          for cap in manifest['caps'].values():
              for source in cap['sources'].values():
                  for part in source['chunks']:
                      chunks[part['url']] = part
          def copy_part(item):
              path, part = item
              data = get(path)
              assert hashlib.sha256(data).hexdigest() == part['sha256'], path
              assert len(data) == part['download_bytes'], path
              target = out/path; target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)
              return len(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              sizes = list(pool.map(copy_part, chunks.items()))
          for path in ['studio/index.html','assets/catalog-v99.js']:
              data = get(path); target = out/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
              print(json.dumps({'source':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
              if path == 'studio/index.html':
                  text = re.sub(r'(<script\s+id="payload"[^>]*>).*?(</script>)', r'\1{}\2', data.decode('utf-8'), flags=re.S)
                  print(json.dumps({'source':'studio_without_payload','chars':len(text),'sha256':hashlib.sha256(text.encode()).hexdigest()}))
          summary = {'manifest_sha256':hashlib.sha256(manifest_bytes).hexdigest(),'verified_chunks':len(chunks),'download_bytes':sum(sizes),'files':{str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file()}}
          pathlib.Path('baseline-audit.json').write_text(json.dumps(summary,indent=2))
          with zipfile.ZipFile('tmam-v100-verified-baseline.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(out.rglob('*')):
                  if p.is_file():
                      info = zipfile.ZipInfo(str(p.relative_to(out)),(1980,1,1,0,0,0)); info.compress_type = zipfile.ZIP_DEFLATED
                      z.writestr(info,p.read_bytes())
          print(json.dumps({'verified_chunks':len(chunks),'archive_bytes':pathlib.Path('tmam-v100-verified-baseline.zip').stat().st_size,'archive_sha256':hashlib.sha256(pathlib.Path('tmam-v100-verified-baseline.zip').read_bytes()).hexdigest()}))
      - name: Publish immutable deployment input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create tmam-bootstrap-v100-20260922 tmam-v100-verified-baseline.zip baseline-audit.json --target "$GITHUB_SHA" --title "TMAM verified browser catalog snapshot" --notes "Deployment input only: the previously published v100 catalog and saved DAGs, preserved with SHA-256 verification. Not a new mathematical result. No credentials or private application data."
      - uses: actions/upload-artifact@v4
        with:
          name: tmam-bootstrap-audit
          path: baseline-audit.json
          retention-days: 7
