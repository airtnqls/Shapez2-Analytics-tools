name: Latest Half fast-path audit

on:
  push:
    branches:
      - optimize/latest-tmam-fastpath
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate latest Half proof baseline
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          python scripts/audit_latest_half_fastpath.py > reports/latest-half-baseline.json 2> reports/latest-half-baseline.stderr.log
          cat reports/latest-half-baseline.json || true
          cat reports/latest-half-baseline.stderr.log || true
      - name: Reproduce the user legacy global macro source
        id: legacy
        continue-on-error: true
        shell: bash
        run: |
          python scripts/audit_user_legacy_macro.py > reports/user-legacy-macro.json 2> reports/user-legacy-macro.stderr.log
          cat reports/user-legacy-macro.json || true
          cat reports/user-legacy-macro.stderr.log || true
      - name: Extract the exact legacy ProcessTree path
        id: legacy_path
        continue-on-error: true
        shell: bash
        run: |
          python scripts/audit_legacy_process_path.py > reports/legacy-process-path.json 2> reports/legacy-process-path.stderr.log
          python - <<'PY'
          import json
          p='reports/legacy-process-path.json'
          data=json.load(open(p,encoding='utf-8'))
          print('nodes',data.get('nodeCount'),'paths',len(data.get('forwardPaths',[])))
          for path in data.get('forwardPaths',[])[:4]:
              print([(item.get('operationToProduce'),item.get('shape')) for item in path])
          PY
          cat reports/legacy-process-path.stderr.log || true
      - name: Search the exact screenshot macro family
        id: macro
        continue-on-error: true
        shell: bash
        run: |
          python scripts/search_user_screenshot_macro.py > reports/user-screenshot-macro-search.json 2> reports/user-screenshot-macro-search.stderr.log
          python - <<'PY'
          import json
          p='reports/user-screenshot-macro-search.json'
          data=json.load(open(p,encoding='utf-8'))
          print({k:data.get(k) for k in ('sequence','firstStates','secondHelpers','testedSecondSwapOutputs')})
          print('hits',len(data.get('hits',[])))
          for hit in data.get('hits',[])[:3]:
              print(json.dumps(hit,ensure_ascii=False))
          PY
          cat reports/user-screenshot-macro-search.stderr.log || true
      - name: Run focused backend checks
        id: tests
        continue-on-error: true
        run: |
          python -m compileall -q backend/corner_half scripts/audit_latest_half_fastpath.py scripts/audit_user_legacy_macro.py scripts/audit_legacy_process_path.py scripts/search_user_screenshot_macro.py
          python - <<'PY'
          from backend.corner_half.half_constructor import construct_half
          from backend.corner_half.proof_dag import half_raw_proof, verify_proof
          code = 'SS--:SS--:-S--:SS--:-S--:cS--:SS--:-S--:SS--:-S--:cS--'
          cert = construct_half(code, 11)
          assert cert.replay_ok
          audit = verify_proof(half_raw_proof(code, 11))
          assert audit.replay_ok and audit.result == code
          print({'status': 'PASS', 'nodes': audit.unique_nodes, 'operations': audit.operation_nodes})
          PY
      - name: Persist concise audit reports
        if: steps.baseline.outcome == 'success' && steps.legacy.outcome == 'success' && steps.legacy_path.outcome == 'success' && steps.macro.outcome == 'success'
        env:
          HEAD_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/latest-half-baseline.json reports/user-legacy-macro.json reports/legacy-process-path.json reports/user-screenshot-macro-search.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record exact legacy Half process path [skip ci]'
          git push origin HEAD:$HEAD_BRANCH
      - name: Publish audit result to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          LEGACY_PATH_OUTCOME: ${{ steps.legacy_path.outcome }}
          MACRO_OUTCOME: ${{ steps.macro.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          {
            echo '<!-- latest-half-fastpath-audit -->'
            echo '## Latest Half fast-path audit'
            echo
            echo "- baseline: \`$BASELINE_OUTCOME\`"
            echo "- user legacy macro: \`$LEGACY_OUTCOME\`"
            echo "- exact legacy path: \`$LEGACY_PATH_OUTCOME\`"
            echo "- screenshot macro search: \`$MACRO_OUTCOME\`"
            echo "- focused tests: \`$TEST_OUTCOME\`"
            echo
            for pair in 'baseline JSON|reports/latest-half-baseline.json' 'user legacy macro JSON|reports/user-legacy-macro.json' 'legacy process path JSON|reports/legacy-process-path.json' 'screenshot macro JSON|reports/user-screenshot-macro-search.json'; do
              title=${pair%%|*}; file=${pair#*|}
              echo "<details><summary>$title</summary>"
              echo
              echo '```json'
              head -c 50000 "$file" 2>/dev/null || true
              echo
              echo '```'
              echo '</details>'
              echo
            done
            echo '<details><summary>stderr</summary>'
            echo
            echo '```text'
            cat reports/*.stderr.log 2>/dev/null | head -c 30000 || true
            echo
            echo '```'
            echo '</details>'
          } > reports/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file reports/pr-comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-half-fastpath-audit
          path: |
            reports/latest-half-baseline.json
            reports/latest-half-baseline.stderr.log
            reports/user-legacy-macro.json
            reports/user-legacy-macro.stderr.log
            reports/legacy-process-path.json
            reports/legacy-process-path.stderr.log
            reports/user-screenshot-macro-search.json
            reports/user-screenshot-macro-search.stderr.log
          if-no-files-found: warn
      - name: Enforce audit success
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          LEGACY_PATH_OUTCOME: ${{ steps.legacy_path.outcome }}
          MACRO_OUTCOME: ${{ steps.macro.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          test "$BASELINE_OUTCOME" = success
          test "$LEGACY_OUTCOME" = success
          test "$LEGACY_PATH_OUTCOME" = success
          test "$MACRO_OUTCOME" = success
          test "$TEST_OUTCOME" = success
