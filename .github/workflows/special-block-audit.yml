name: Audit legacy S-S-c Stack-Pin block

on:
  push:
    branches:
      - experiment/half-linear-fastpath
    paths:
      - 'experiments/legacy_recipe/decompose_special_block.py'
      - 'experiments/legacy_recipe/search_family_macro.py'
      - 'corner_tracer.py'
      - 'shape.py'
      - '.github/workflows/special-block-audit.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'experiments/legacy_recipe/decompose_special_block.py'
      - 'experiments/legacy_recipe/search_family_macro.py'
      - 'corner_tracer.py'
      - 'shape.py'
      - '.github/workflows/special-block-audit.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay and decompose special block
        working-directory: experiments/legacy_recipe
        run: |
          PYTHONPATH=../.. python - <<'PY' > special-block-audit.json
          import json
          from decompose_special_block import audit
          print(json.dumps(audit(helper_limit=700), ensure_ascii=False, indent=2))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('special-block-audit.json').read_text(encoding='utf-8'))
          summary = {
              'special_pillar': data['special_pillar'],
              'legacy_predecessor': data['legacy_predecessor'],
              'push_result': data['push_result'],
              'corner_target': data['corner_target'],
              'push_corner_distance': data['push_corner_distance'],
              'push_corner_exact': data['push_corner_exact'],
              'half_target': data['half_target'],
              'helper_pool': data['helper_pool'],
              'stack_predecessor_decompositions': data['stack_predecessor_decompositions'][:3],
              'swap_half_decompositions': data['swap_half_decompositions'][:3],
          }
          text = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          Path('special-block-summary.json').write_text(text, encoding='utf-8')
          print(text)
          PY
      - name: Persist summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const local = 'experiments/legacy_recipe/special-block-summary.json';
            if (!fs.existsSync(local)) return;
            const path = 'experiments/results/special-block-summary.json';
            const content = fs.readFileSync(local, 'utf8');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'experiment/half-linear-fastpath' });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'experiment/half-linear-fastpath',
              message: 'Record special Stack-Pin block audit [skip ci]',
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {}),
            });
      - name: Publish compact result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tmam-special-block-audit -->';
            const path = 'experiments/legacy_recipe/special-block-summary.json';
            const data = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
            const body = `${marker}\n### Legacy S-S-c Stack→Pin block audit\n\n` +
              `- Push exact Corner: \`${data?.push_corner_exact ? 'yes' : 'no'}\` (distance ${data?.push_corner_distance ?? 'missing'})\n` +
              `- exact Stack decompositions: \`${data?.stack_predecessor_decompositions?.length ?? 'missing'}\`\n` +
              `- exact Swap-to-Half decompositions: \`${data?.swap_half_decompositions?.length ?? 'missing'}\`\n` +
              `- summary: \`experiments/results/special-block-summary.json\``;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: special-block-audit
          path: |
            experiments/legacy_recipe/special-block-audit.json
            experiments/legacy_recipe/special-block-summary.json
          if-no-files-found: warn
