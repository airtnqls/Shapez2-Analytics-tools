name: Persist global predecessor research

on:
  push:
    branches: [optimize/latest-tmam-fastpath]
    paths:
      - scripts/audit_legacy_predecessor_all_layers.py
      - scripts/audit_legacy_process_path.py
      - .github/workflows/persist-global-predecessor-research.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/latest-tmam-fastpath
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate reports
        run: |
          mkdir -p reports
          python scripts/audit_legacy_predecessor_all_layers.py > reports/legacy-predecessor-all-layers.json
          python scripts/audit_legacy_process_path.py > reports/legacy-process-path.json
          test -s reports/legacy-predecessor-all-layers.json
          test -s reports/legacy-process-path.json
      - name: Commit reports
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/legacy-predecessor-all-layers.json reports/legacy-process-path.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist global predecessor research [skip ci]'
          git pull --rebase origin optimize/latest-tmam-fastpath
          git push origin HEAD:optimize/latest-tmam-fastpath
