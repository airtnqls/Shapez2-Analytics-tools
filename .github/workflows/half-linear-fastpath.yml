name: Half linear fast-path experiment

on:
  push:
    branches:
      - experiment/half-linear-fastpath
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Python regression tests
        working-directory: experiments/half_fastpath
        run: python -m unittest -v test_half_linear_fastpath.py
      - name: Generate Half benchmark
        working-directory: experiments/half_fastpath
        run: python half_linear_fastpath.py > benchmark.json
      - name: Generate cross-cutting optimizer benchmark
        working-directory: experiments/half_fastpath
        run: python optimizer_suite.py > optimizer-benchmark.json

      - name: Generate legacy project-physics diagnostics
        working-directory: experiments/legacy_recipe
        run: |
          PYTHONPATH=../.. python legacy_corner_recipe.py > legacy-recipe.json
          PYTHONPATH=../.. python actual_corner_process.py > actual-corner-process.json
          PYTHONPATH=../.. python - <<'PY' > legacy-search.json
          import json
          from search_legacy_recipe import search
          print(json.dumps(search(max_swap_depth=1, state_limit=5000), ensure_ascii=False, indent=2))
          PY
      - name: Run actual-physics best-first recipe search
        working-directory: experiments/legacy_recipe
        run: |
          PYTHONPATH=../.. python - <<'PY' > best-first-recipe.json
          import json
          from best_first_recipe import best_first_search
          result = best_first_search(max_depth=4, beam_width=80, auxiliary_limit=30, state_limit=12000, max_seconds=65.0)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('best-first-recipe.json').read_text(encoding='utf-8'))
          summary = {
              'stop_reason': data['stop_reason'],
              'elapsed_seconds': data['elapsed_seconds'],
              'expanded': data['expanded'],
              'generated': data['generated'],
              'seen': data['seen'],
              'depth_histogram': data['depth_histogram'],
              'hit': data['hit'],
              'closest': data['closest'][:5],
          }
          Path('best-first-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Publish legacy diagnostic comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tmam-legacy-recipe-diagnostic -->';
            const read = (path, fallback) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : fallback;
            const recipe = read('experiments/legacy_recipe/legacy-recipe.json', '{"error":"recipe diagnostic missing"}');
            const actual = read('experiments/legacy_recipe/actual-corner-process.json', '{"error":"actual Corner audit missing"}');
            const search = read('experiments/legacy_recipe/legacy-search.json', '{"error":"restricted search missing"}');
            const best = read('experiments/legacy_recipe/best-first-summary.json', '{"error":"best-first summary missing"}');
            const body = `${marker}\n### Legacy project-physics recipe diagnostic\n\n#### Direct legacy constructor\n\`\`\`json\n${recipe}\n\`\`\`\n\n#### Actual legacy Corner subtype/replay audit\n\`\`\`json\n${actual}\n\`\`\`\n\n#### Restricted exact Swap search\n\`\`\`json\n${search}\n\`\`\`\n\n#### Actual-physics best-first search\n\`\`\`json\n${best}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Run legacy project-physics replay tests
        working-directory: experiments/legacy_recipe
        run: PYTHONPATH=../.. python -m unittest -v test_legacy_corner_recipe.py

      - name: Run TypeScript-shaped regression tests
        working-directory: experiments/tmam_fastpath_ts
        run: |
          set +e
          npm test > test-ts.log 2>&1
          status=$?
          cat test-ts.log
          exit $status
      - name: Generate TypeScript-shaped benchmark
        if: success()
        working-directory: experiments/tmam_fastpath_ts
        run: npm run bench > benchmark-ts.json

      - name: Print reports
        if: success()
        run: |
          cat experiments/half_fastpath/benchmark.json
          cat experiments/half_fastpath/optimizer-benchmark.json
          cat experiments/legacy_recipe/actual-corner-process.json
          cat experiments/legacy_recipe/best-first-summary.json
          cat experiments/tmam_fastpath_ts/benchmark-ts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmam-fastpath-benchmarks
          path: |
            experiments/half_fastpath/benchmark.json
            experiments/half_fastpath/optimizer-benchmark.json
            experiments/legacy_recipe/legacy-recipe.json
            experiments/legacy_recipe/actual-corner-process.json
            experiments/legacy_recipe/legacy-search.json
            experiments/legacy_recipe/best-first-recipe.json
            experiments/legacy_recipe/best-first-summary.json
            experiments/tmam_fastpath_ts/benchmark-ts.json
            experiments/tmam_fastpath_ts/test-ts.log
          if-no-files-found: warn
