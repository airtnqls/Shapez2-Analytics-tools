name: Half linear fast-path experiment

on:
  push:
    branches:
      - experiment/half-linear-fastpath
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Python regression tests
        working-directory: experiments/half_fastpath
        run: python -m unittest -v test_half_linear_fastpath.py
      - name: Generate Half benchmark
        working-directory: experiments/half_fastpath
        run: python half_linear_fastpath.py > benchmark.json
      - name: Generate cross-cutting optimizer benchmark
        working-directory: experiments/half_fastpath
        run: python optimizer_suite.py > optimizer-benchmark.json

      - name: Generate legacy project-physics diagnostics
        working-directory: experiments/legacy_recipe
        run: |
          PYTHONPATH=../.. python legacy_corner_recipe.py > legacy-recipe.json
          PYTHONPATH=../.. python actual_corner_process.py > actual-corner-process.json
          PYTHONPATH=../.. python - <<'PY' > legacy-search.json
          import json
          from search_legacy_recipe import search
          print(json.dumps(search(max_swap_depth=1, state_limit=5000), ensure_ascii=False, indent=2))
          PY
      - name: Run short actual-physics search regression
        working-directory: experiments/legacy_recipe
        run: |
          PYTHONPATH=../.. python - <<'PY' > best-first-recipe.json
          import json
          from best_first_recipe import best_first_search
          result = best_first_search(max_depth=3, beam_width=32, auxiliary_limit=20, state_limit=2500, max_seconds=8.0)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('best-first-recipe.json').read_text(encoding='utf-8'))
          summary = {
              'stop_reason': data['stop_reason'],
              'elapsed_seconds': data['elapsed_seconds'],
              'expanded': data['expanded'],
              'generated': data['generated'],
              'seen': data['seen'],
              'hit': data['hit'],
              'closest': data['closest'][:1],
          }
          Path('best-first-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Publish compact legacy diagnostic
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tmam-legacy-recipe-diagnostic -->';
            const load = (path) => fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
            const recipe = load('experiments/legacy_recipe/legacy-recipe.json');
            const actual = load('experiments/legacy_recipe/actual-corner-process.json');
            const restricted = load('experiments/legacy_recipe/legacy-search.json');
            const best = load('experiments/legacy_recipe/best-first-summary.json');
            const closest = best?.closest?.[0] ?? null;
            const body = `${marker}\n### Legacy/project-physics fast-path summary\n\n` +
              `- 11-layer legacy classification: \`${actual?.classification ?? 'missing'}\`\n` +
              `- selected legacy operation: \`${actual?.selected_operation ?? 'missing'}\`\n` +
              `- q0 above-bottom replay: \`${recipe?.q0_matches_above_bottom ?? false}\`; bottom: \`${recipe?.q0_bottom_transition ?? 'missing'}\`\n` +
              `- one-Swap search hit: \`${restricted?.hit ? 'yes' : 'no'}\`; closest distance: \`${restricted?.closest?.[0]?.distance ?? 'missing'}\`\n` +
              `- short best-first hit: \`${best?.hit ? 'yes' : 'no'}\`; closest mismatch: \`${closest?.distance?.mismatch ?? 'missing'}\`\n` +
              `- closest code: \`${closest?.code ?? 'missing'}\`\n` +
              `- exhaustive diagnostics remain in workflow artifacts.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Run legacy project-physics replay tests
        working-directory: experiments/legacy_recipe
        run: PYTHONPATH=../.. python -m unittest -v test_legacy_corner_recipe.py

      - name: Run TypeScript-shaped regression tests
        working-directory: experiments/tmam_fastpath_ts
        run: |
          set +e
          npm test > test-ts.log 2>&1
          status=$?
          cat test-ts.log
          exit $status
      - name: Generate TypeScript-shaped benchmarks
        if: success()
        working-directory: experiments/tmam_fastpath_ts
        run: |
          npm run bench > benchmark-ts.json
          node src/frontierBenchmark.mjs > frontier-fallback-benchmark.json

      - name: Print reports
        if: success()
        run: |
          cat experiments/half_fastpath/benchmark.json
          cat experiments/half_fastpath/optimizer-benchmark.json
          cat experiments/legacy_recipe/best-first-summary.json
          cat experiments/tmam_fastpath_ts/benchmark-ts.json
          cat experiments/tmam_fastpath_ts/frontier-fallback-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmam-fastpath-benchmarks
          path: |
            experiments/half_fastpath/benchmark.json
            experiments/half_fastpath/optimizer-benchmark.json
            experiments/legacy_recipe/legacy-recipe.json
            experiments/legacy_recipe/actual-corner-process.json
            experiments/legacy_recipe/legacy-search.json
            experiments/legacy_recipe/best-first-recipe.json
            experiments/legacy_recipe/best-first-summary.json
            experiments/tmam_fastpath_ts/benchmark-ts.json
            experiments/tmam_fastpath_ts/frontier-fallback-benchmark.json
            experiments/tmam_fastpath_ts/test-ts.log
          if-no-files-found: warn
