name: Global predecessor all-layer CI

on:
  push:
    branches: [optimize/latest-tmam-fastpath]
    paths:
      - backend/corner_half/global_predecessor.py
      - backend/corner_half/test_global_predecessor.py
      - scripts/search_pair_assembly_bottom_fix.py
      - scripts/search_build_pinable_shape2.py
      - .github/workflows/global-predecessor-ci.yml
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test global predecessor
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          {
            python -m compileall -q backend/corner_half/global_predecessor.py scripts/search_build_pinable_shape2.py
            python -m unittest -v backend.corner_half.test_global_predecessor
          } 2>&1 | tee reports/global-predecessor-tests.log
      - name: Complete the legacy build_pinable_shape2 helper search
        id: shape2
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/search_build_pinable_shape2.py 2>reports/build-pinable-shape2-search.stderr.log | tee reports/build-pinable-shape2-search.json
      - name: Generate pair-assembly repair search
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/search_pair_assembly_bottom_fix.py 2>reports/pair-assembly-bottom-fix.stderr.log | tee reports/pair-assembly-bottom-fix.json
      - name: Write and print concise synthesis results
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
          SHAPE2: ${{ steps.shape2.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          report={
              'unit':os.environ.get('UNIT'),
              'repair':os.environ.get('REPAIR'),
              'shape2':os.environ.get('SHAPE2'),
              'tails':{},
          }
          for name in ('global-predecessor-tests.log','build-pinable-shape2-search.stderr.log','pair-assembly-bottom-fix.stderr.log'):
              p=pathlib.Path('reports')/name
              if p.exists():
                  report['tails'][name]='\n'.join(p.read_text(encoding='utf-8',errors='replace').splitlines()[-80:])
          pathlib.Path('reports/global-predecessor-ci-status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          for name in ('build-pinable-shape2-search','pair-assembly-bottom-fix'):
              p=pathlib.Path('reports')/(name+'.json')
              if not p.exists() or not p.read_text(encoding='utf-8').strip():
                  print(name, 'NO JSON')
                  continue
              data=json.loads(p.read_text(encoding='utf-8'))
              if name.startswith('pair'):
                  print({k:data.get(k) for k in ('exhaustiveTargets','solved','failed')})
              else:
                  for item in data.get('reports',[]):
                      print({k:item.get(k) for k in ('target','a1','a2','checked','craftable','halfStable','fullStable','skipped','errorType')})
                      print('hits',len(item.get('hits',[])),item.get('hits',[])[:2])
          PY
      - name: Persist concise status
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/global-predecessor-ci-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist global predecessor CI status [skip ci]'
          git pull --rebase origin optimize/latest-tmam-fastpath
          git push origin HEAD:optimize/latest-tmam-fastpath
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-predecessor-all-layer
          path: reports/
          if-no-files-found: error
      - name: Enforce success
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
          SHAPE2: ${{ steps.shape2.outcome }}
        run: |
          test "$UNIT" = success
          test "$REPAIR" = success
          test "$SHAPE2" = success
