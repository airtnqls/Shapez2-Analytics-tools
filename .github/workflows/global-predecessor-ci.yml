name: Global predecessor all-layer CI

on:
  push:
    branches: [optimize/latest-tmam-fastpath]
    paths:
      - backend/corner_half/global_predecessor.py
      - backend/corner_half/test_global_predecessor.py
      - scripts/search_pair_assembly_bottom_fix.py
      - .github/workflows/global-predecessor-ci.yml
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test global predecessor
        run: |
          python -m compileall -q backend/corner_half/global_predecessor.py
          python -m unittest -v backend.corner_half.test_global_predecessor
      - name: Generate pair-assembly repair search
        run: |
          mkdir -p reports
          python scripts/search_pair_assembly_bottom_fix.py > reports/pair-assembly-bottom-fix.json
          python - <<'PY'
          import json
          data=json.load(open('reports/pair-assembly-bottom-fix.json',encoding='utf-8'))
          print({k:data[k] for k in ('exhaustiveTargets','solved','failed')})
          print('signatures',data['deltaSignatures'])
          print('family tail',data['highLayerFamily'][-4:])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: global-predecessor-all-layer
          path: reports/pair-assembly-bottom-fix.json
