name: Complete legacy build_pinable_shape2

on:
  push:
    branches:
      - experiment/half-linear-fastpath
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaust stable A/B/C/D templates
        working-directory: experiments/legacy_recipe
        run: |
          PYTHONPATH=../.. python search_pinable2_templates.py > pinable2-template-search.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('pinable2-template-search.json').read_text(encoding='utf-8'))
          summary = {
              'pillar': data['pillar'],
              'unfinished_idea': data['unfinished_idea'],
              'variant_counts': data['variant_counts'],
              'checked': data['checked'],
              'stable_checked': data['stable_checked'],
              'hit': data['hit'],
              'closest': data['closest'][:5],
          }
          Path('pinable2-template-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Publish template result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tmam-pinable2-template-search -->';
            const path = 'experiments/legacy_recipe/pinable2-template-summary.json';
            const data = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '{"error":"summary missing"}';
            const body = `${marker}\n### Complete legacy build_pinable_shape2 template search\n\n\`\`\`json\n${data}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinable2-template-search
          path: |
            experiments/legacy_recipe/pinable2-template-search.json
            experiments/legacy_recipe/pinable2-template-summary.json
          if-no-files-found: warn
