name: Complete legacy build_pinable_shape2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce stable A/B/C/D template exhaustion
        working-directory: experiments/legacy_recipe
        run: PYTHONPATH=../.. python search_pinable2_templates.py > pinable2-template-search.json
      - uses: actions/upload-artifact@v4
        with:
          name: pinable2-template-search
          path: experiments/legacy_recipe/pinable2-template-search.json
