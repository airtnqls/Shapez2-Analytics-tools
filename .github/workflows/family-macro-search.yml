name: Search periodic Half family macro

on:
  push:
    branches:
      - experiment/half-linear-fastpath
    paths:
      - 'experiments/legacy_recipe/search_family_macro.py'
      - 'experiments/legacy_recipe/search_family_macro_v2.py'
      - 'experiments/legacy_recipe/legacy_corner_recipe.py'
      - 'shape.py'
      - '.github/workflows/family-macro-search.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'experiments/legacy_recipe/search_family_macro.py'
      - 'experiments/legacy_recipe/search_family_macro_v2.py'
      - 'experiments/legacy_recipe/legacy_corner_recipe.py'
      - 'shape.py'
      - '.github/workflows/family-macro-search.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/half-linear-fastpath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search F1 to F2 macro with indexed streaming expansion
        working-directory: experiments/legacy_recipe
        run: |
          PYTHONPATH=../.. python - <<'PY' > family-macro-search-v2.json
          import json
          from search_family_macro_v2 import search_macro_v2
          result = search_macro_v2(
              repeats=1,
              max_depth=7,
              beam_width=80,
              helper_limit_per_state=12,
              max_seconds=115.0,
              state_limit=40000,
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('family-macro-search-v2.json').read_text(encoding='utf-8'))
          summary = {
              'schema_version': data['schema_version'],
              'family': data['family'],
              'repeats': data['repeats'],
              'start': data['start'],
              'goal': data['goal'],
              'helper_pool': data['helper_pool'],
              'rotated_helper_index': data['rotated_helper_index'],
              'helper_limit_per_state': data['helper_limit_per_state'],
              'stop_reason': data['stop_reason'],
              'elapsed_seconds': data['elapsed_seconds'],
              'expanded': data['expanded'],
              'generated': data['generated'],
              'seen': data['seen'],
              'helper_selection_total': data['helper_selection_total'],
              'symmetry_prunes': data['symmetry_prunes'],
              'no_op_prunes': data['no_op_prunes'],
              'hit': data['hit'],
              'closest': data['closest'][:5],
          }
          text = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          Path('family-macro-summary-v2.json').write_text(text, encoding='utf-8')
          print(text)
          PY
      - name: Persist reproducible summary through GitHub API
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'experiments/results/family-macro-summary-v2.json';
            const local = 'experiments/legacy_recipe/family-macro-summary-v2.json';
            if (!fs.existsSync(local)) return;
            const content = fs.readFileSync(local, 'utf8');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'experiment/half-linear-fastpath',
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'experiment/half-linear-fastpath',
              message: 'Record indexed family macro search result [skip ci]',
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {}),
            });
      - name: Publish compact macro result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tmam-family-macro-search -->';
            const path = 'experiments/legacy_recipe/family-macro-summary-v2.json';
            const data = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
            const closest = data?.closest?.[0] ?? null;
            const body = `${marker}\n### Indexed periodic Half F₁ → F₂ macro search\n\n` +
              `- helper pool/index: \`${data?.helper_pool ?? 'missing'} / ${data?.rotated_helper_index ?? 'missing'}\`\n` +
              `- helper cap per state: \`${data?.helper_limit_per_state ?? 'missing'}\`\n` +
              `- exact hit: \`${data?.hit ? 'yes' : 'no'}\`\n` +
              `- stop: \`${data?.stop_reason ?? 'missing'}\`\n` +
              `- expanded/generated: \`${data?.expanded ?? 'missing'} / ${data?.generated ?? 'missing'}\`\n` +
              `- symmetry/no-op prunes: \`${data?.symmetry_prunes ?? 'missing'} / ${data?.no_op_prunes ?? 'missing'}\`\n` +
              `- closest mismatch: \`${closest?.distance?.mismatch ?? 'missing'}\`\n` +
              `- closest code: \`${closest?.code ?? 'missing'}\`\n` +
              `- exact path is persisted at \`experiments/results/family-macro-summary-v2.json\`.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-macro-search-v2
          path: |
            experiments/legacy_recipe/family-macro-search-v2.json
            experiments/legacy_recipe/family-macro-summary-v2.json
          if-no-files-found: warn
