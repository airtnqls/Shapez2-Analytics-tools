name: User legacy macro audit

on:
  push:
    branches:
      - optimize/latest-tmam-fastpath
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print exact legacy predecessor and Pin output
        run: python scripts/audit_user_legacy_macro.py
