name: Apply latest proof fast paths

on:
  push:
    branches:
      - optimize/latest-tmam-fastpath
    paths:
      - scripts/apply_latest_proof_fastpaths.py
      - .github/workflows/apply-latest-proof-fastpaths.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/latest-tmam-fastpath
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply generated patch
        run: python scripts/apply_latest_proof_fastpaths.py
      - name: Validate patched proof kernel
        run: |
          python -m compileall -q backend/corner_half
          python scripts/audit_latest_half_fastpath.py > /tmp/latest-half-after.json
          cat /tmp/latest-half-after.json
      - name: Commit patched production files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/corner_half/proof_dag.py backend/corner_half/corner_full_replay.py
          git commit -m 'Optimize exact Corner and Half proof construction'
          git push origin HEAD:optimize/latest-tmam-fastpath
