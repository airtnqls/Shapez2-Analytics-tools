name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - "opt/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci

      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee ci-tests.log

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee ci-typecheck.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee ci-build.log

      - name: Worker smoke
        id: worker
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run smoke:worker 2>&1 | tee ci-worker.log

      - name: Backend smoke
        id: backend
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run smoke:backend 2>&1 | tee ci-backend.log

      - name: Server smoke
        id: server
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run smoke:server 2>&1 | tee ci-server.log

      - name: Static smoke
        id: static
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run smoke:static 2>&1 | tee ci-static.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-stack-ci-logs
          path: ci-*.log
          if-no-files-found: error

      - name: Fail on any check regression
        if: ${{ always() && (steps.tests.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.build.outcome != 'success' || steps.worker.outcome != 'success' || steps.backend.outcome != 'success' || steps.server.outcome != 'success' || steps.static.outcome != 'success') }}
        run: exit 1
