name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - "opt/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee ci-typecheck.log

      - name: Vitest
        id: tests
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm test -- --run 2>&1 | tee ci-tests.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee ci-build.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-stack-ci-logs
          path: ci-*.log
          if-no-files-found: error

      - name: Enforce all checks
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'typecheck=%s\ntests=%s\nbuild=%s\n' "$TYPECHECK" "$TESTS" "$BUILD"
          test "$TYPECHECK" = success
          test "$TESTS" = success
          test "$BUILD" = success
