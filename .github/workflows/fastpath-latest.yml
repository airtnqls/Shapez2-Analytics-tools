name: Latest fastpath optimization

on:
  push:
    branches:
      - optimization/latest-fastpath-v2
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm ci
      - name: Build worker
        run: npm run build:worker
      - name: Run latest baseline audit
        run: python scripts/fastpath-latest-baseline.py
      - name: Run unit and type checks
        run: npm run test:unit && npm run typecheck
      - name: Publish PR baseline summary
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file reports/FASTPATH_LATEST_SUMMARY.md --edit-last --create-if-none
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: fastpath-latest-baseline
          path: |
            reports/FASTPATH_LATEST_BASELINE.json
            reports/FASTPATH_LATEST_SUMMARY.md
            reports/FASTPATH_LATEST_GRAPHS.json.gz
          if-no-files-found: error
