name: Build pinable shape2 probe

on:
  push:
    branches: [optimize/latest-tmam-fastpath]
    paths:
      - scripts/search_build_pinable_shape2.py
      - backend/corner_half/global_predecessor.py
      - .github/workflows/build-pinable-shape2-probe.yml
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact helper synthesis
        run: |
          mkdir -p reports
          python scripts/search_build_pinable_shape2.py | tee reports/build-pinable-shape2-search.json
          python - <<'PY' | tee reports/build-pinable-shape2-summary.json
          import json
          data=json.load(open('reports/build-pinable-shape2-search.json',encoding='utf-8'))
          out=[]
          for r in data.get('reports',[]):
              out.append({
                  'target':r.get('target'), 'a1':r.get('a1'), 'a2':r.get('a2'),
                  'checked':r.get('checked'), 'craftable':r.get('craftable'),
                  'halfStable':r.get('halfStable'), 'fullStable':r.get('fullStable'),
                  'hits':r.get('hits',[])[:20], 'skipped':r.get('skipped'),
              })
          print(json.dumps({'schemaVersion':1,'reports':out},ensure_ascii=False,indent=2))
          PY
      - name: Persist report on research branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/build-pinable-shape2-search.json reports/build-pinable-shape2-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist build_pinable_shape2 synthesis [skip ci]'
          git pull --rebase origin optimize/latest-tmam-fastpath
          git push origin HEAD:optimize/latest-tmam-fastpath
      - uses: actions/upload-artifact@v4
        with:
          name: build-pinable-shape2-search
          path: |
            reports/build-pinable-shape2-search.json
            reports/build-pinable-shape2-summary.json
          if-no-files-found: error
