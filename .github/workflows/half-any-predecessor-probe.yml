name: Half unrestricted predecessor probe

on:
  push:
    branches: [optimize/latest-tmam-fastpath]
    paths:
      - scripts/patch_raw_pinpush_any.py
      - scripts/probe_half_any_predecessor.ts
      - scripts/factor_any_predecessor_through_swap.py
      - lib/raw-pinpush-rank0.ts
      - .github/workflows/half-any-predecessor-probe.yml
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Patch research export and run unrestricted inverse
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports /tmp/half-any-probe
          python scripts/patch_raw_pinpush_any.py
          npx esbuild scripts/probe_half_any_predecessor.ts --bundle --platform=node --format=esm --outfile=/tmp/half-any-probe/probe.mjs
          node /tmp/half-any-probe/probe.mjs 2>reports/half-any-predecessor-probe.stderr.log | tee reports/half-any-predecessor-probe.json
      - name: Factor predecessor through the legacy second Swapper
        id: factor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/factor_any_predecessor_through_swap.py reports/half-any-predecessor-probe.json \
            2>reports/half-any-predecessor-factor.stderr.log | tee reports/half-any-predecessor-factor.json
      - name: Build concise result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          def load(path):
              p=pathlib.Path(path)
              if not p.exists() or not p.read_text(encoding='utf-8').strip():
                  return None
              return json.loads(p.read_text(encoding='utf-8'))
          probe=load('reports/half-any-predecessor-probe.json') or {}
          factor=load('reports/half-any-predecessor-factor.json') or {}
          summary={
              'schemaVersion':1,
              'probe':{
                  'elapsedMs':probe.get('elapsedMs'),
                  'ok':probe.get('result',{}).get('ok'),
                  'route':probe.get('result',{}).get('route'),
                  'transitions':probe.get('result',{}).get('transitions'),
                  'maxFailedStates':probe.get('result',{}).get('maxFailedStates'),
                  'predecessor':probe.get('result',{}).get('predecessor'),
                  'predecessorRank0':probe.get('predecessorRank0'),
                  'replay':probe.get('replay'),
                  'replayOk':probe.get('replayOk'),
                  'predecessorColumns':probe.get('predecessorColumns'),
              },
              'factor':{
                  'predecessorFound':factor.get('predecessorFound'),
                  'matchesCount':len(factor.get('matches',[])),
                  'matches':factor.get('matches',[])[:5],
                  'nearest':factor.get('nearest',[])[:10],
              },
          }
          out=pathlib.Path('reports/half-any-predecessor-summary.json')
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
          cat reports/half-any-predecessor-probe.stderr.log reports/half-any-predecessor-factor.stderr.log 2>/dev/null || true
          echo "probe outcome: ${{ steps.probe.outcome }}"
          echo "factor outcome: ${{ steps.factor.outcome }}"
      - name: Publish result to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- half-any-predecessor-probe -->'
            echo '## Half unrestricted predecessor probe'
            echo
            echo '```json'
            cat reports/half-any-predecessor-summary.json 2>/dev/null || true
            echo
            echo '```'
          } > reports/half-any-pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file reports/half-any-pr-comment.md
      - name: Restore patched source
        if: always()
        run: git checkout -- lib/raw-pinpush-rank0.ts
      - name: Persist report on research branch
        if: always()
        env:
          HEAD_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          touch reports/half-any-predecessor-probe.json reports/half-any-predecessor-probe.stderr.log \
                reports/half-any-predecessor-factor.json reports/half-any-predecessor-factor.stderr.log \
                reports/half-any-predecessor-summary.json
          git add reports/half-any-predecessor-probe.json reports/half-any-predecessor-probe.stderr.log \
                  reports/half-any-predecessor-factor.json reports/half-any-predecessor-factor.stderr.log \
                  reports/half-any-predecessor-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist unrestricted Half predecessor probe [skip ci]'
          git pull --rebase origin "$HEAD_BRANCH"
          git push origin HEAD:"$HEAD_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: half-any-predecessor-probe
          path: |
            reports/half-any-predecessor-probe.json
            reports/half-any-predecessor-probe.stderr.log
            reports/half-any-predecessor-factor.json
            reports/half-any-predecessor-factor.stderr.log
            reports/half-any-predecessor-summary.json
          if-no-files-found: warn
      - name: Enforce probe execution
        if: always()
        env:
          PROBE: ${{ steps.probe.outcome }}
          FACTOR: ${{ steps.factor.outcome }}
        run: |
          test "$PROBE" = success
          test "$FACTOR" = success
